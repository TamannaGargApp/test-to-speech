server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow audio uploads for speech to text (backend limit is 25 MB)
    client_max_body_size 26M;

    # Fix Cross-Origin-Opener-Policy for Google OAuth popup
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 300s;  # long transcriptions
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Allow CORS for API
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        # Short cache so updated files show up; pages add ?v=... to CSS/JS links
        expires 1h;
        add_header Cache-Control "public";
    }
}